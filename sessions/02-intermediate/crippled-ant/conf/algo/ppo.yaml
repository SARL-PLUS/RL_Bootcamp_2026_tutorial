# PPO defaults for Ant-v5 (close to the SB3-zoo settings).
# Everything except name/policy/policy_kwargs/normalize_* is passed straight
# to the stable_baselines3.PPO constructor.
name: PPO
policy: MlpPolicy
policy_kwargs:
  net_arch: [256, 256]
# VecNormalize — on-policy PPO benefits from both obs and reward normalisation.
normalize_obs: true
normalize_reward: true

learning_rate: 3.0e-4
n_steps: 2048          # per env -> 8 envs = 16384 steps per rollout
batch_size: 256
n_epochs: 10
gamma: 0.99
gae_lambda: 0.95
ent_coef: 0.0
clip_range: 0.2
